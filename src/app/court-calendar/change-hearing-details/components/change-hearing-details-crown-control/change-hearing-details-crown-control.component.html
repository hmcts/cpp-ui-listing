<div>
  <h4 pdk-margin-bottom="1">Start date</h4>
  <p pdk-margin-top="1">
    {{ startDate() | date: 'dd MMMM yyyy' }}
  </p>
  <pdk-form-field>
    <pdk-checkbox
      [id]="'multiDay'"
      name="multiDay"
      [ngModel]="isMultiDay"
      #multiDay="ngModel"
      (ngModelChange)="invertMultiDay($event)"
      [ngModelOptions]="{ standalone: true }"
    >
      This is a multi-day hearing
    </pdk-checkbox>
  </pdk-form-field>
  @if (multiDay.value) {
    <pdk-checkbox-conditional>
      <pdk-form-field label="End date" labelType="small" [errorMessages]="errorMessages">
        <pdk-date-input
          [id]="'hearing-endDate'"
          [formControl]="endDateControl"
          [minDate]="minDate"
          weekDate
          required
          picker
        >
        </pdk-date-input>
      </pdk-form-field>
      <div class="multidayHearing">
        <non-sitting-days
          name="nonSittingDays"
          [dateRange]="dateRange"
          [jurisdictionType]="jurisdictionType()"
          [ngModel]="nonSittingDays()"
          (onValidationError)="onValidationError.emit($event)"
        >
        </non-sitting-days>
        @if (selectedCourtCentre()) {
          <non-default-days
            name="nonDefaultDays"
            [dateRange]="dateRange"
            [courtCentreId]="selectedCourtCentre().id"
            [parentCourtRoomId]="parentCourtRoomId()"
            [hearingDays]="hearingDays()"
            [ngModel]="nonDefaultDays()"
            [defaultStartTime]="selectedCourtCentre().defaultStartTime"
            [jurisdictionType]="jurisdictionType()"
            (onValidationError)="onValidationError.emit($event)"
          >
          </non-default-days>
        }
      </div>
    </pdk-checkbox-conditional>
  }
  @if (!multiDay.value) {
    @if (hearingSlots()?.length > 0) {
      <hearing-start-time-within-session-time
        name="courtScheduleId"
        [ngModel]="hearingCourtScheduleId()"
        [hearingSlots]="hearingSlots()"
        [startTime]="timeToCompare"
      ></hearing-start-time-within-session-time>
    }
    <change-hearing-start-time-controls
      [startTime]="startTime()"
      (startTimeChange)="timeToCompare = $event"
      [duration]="duration()"
    ></change-hearing-start-time-controls>
  }
</div>
