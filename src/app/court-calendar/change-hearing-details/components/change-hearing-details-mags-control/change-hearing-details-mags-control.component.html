<div>
  <h4 pdk-margin-bottom="1">Start date</h4>
  <p pdk-margin-top="1">
    {{ startDate() | date: 'dd MMMM yyyy' }}
  </p>
  @if (isMultiDay) {
    <h4 pdk-margin-bottom="1">End date</h4>
    <p pdk-margin-top="1" pdk-margin-bottom="0">
      {{ endDate() | date: 'dd MMMM yyyy' }}
    </p>
    <non-sitting-days name="nonSittingDays" [readOnly]="true" [ngModel]="nonSittingDays()">
    </non-sitting-days>
  }
  @if (!isMultiDay) {
    @if (hearingSlots()?.length > 0) {
      <hearing-start-time-within-session-time
        name="courtScheduleId"
        [ngModel]="hearingCourtScheduleId()"
        [hearingSlots]="hearingSlots()"
        [startTime]="timeToCompare"
      ></hearing-start-time-within-session-time>
    }
    <change-hearing-start-time-controls
      [startTime]="originalStartTime()"
      (startTimeChange)="timeToCompare = $event"
      [duration]="duration()"
    ></change-hearing-start-time-controls>
  }
</div>
